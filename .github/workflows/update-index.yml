name: Update Registry Index

on:
  repository_dispatch:
    types: [chart-published]
  workflow_dispatch:
    inputs:
      chart-name:
        description: 'Chart name'
        required: true
        type: string
        default: 'keycloak'
      chart-version:
        description: 'Chart version'
        required: true
        type: string
      oci-url:
        description: 'Full OCI URL (e.g., oci://ghcr.io/org/charts/name)'
        required: true
        type: string
        default: 'oci://ghcr.io/chronolite-technologies/charts/keycloak'

permissions:
  contents: write
  packages: read

jobs:
  update:
    uses: chronolite-technologies/helm-workflows/.github/workflows/update-registry.yml@main
    with:
      chart-name: ${{ github.event.client_payload.chart || inputs.chart-name }}
      chart-version: ${{ github.event.client_payload.version || inputs.chart-version }}
      oci-url: ${{ github.event.client_payload.oci_url || inputs.oci-url }}
    secrets: inherit
